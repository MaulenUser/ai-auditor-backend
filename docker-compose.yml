services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_auditor}
      POSTGRES_USER: ${POSTGRES_USER:-ai_auditor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
    command: ["python", "-m", "uvicorn", "bitrix_ingest.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BITRIX_DATABASE_URL: postgresql://${POSTGRES_USER:-ai_auditor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_auditor}
      AI_AUDITOR_AUTH_REQUIRED: "true"
      AI_AUDITOR_AUTH_SECRET: ${AI_AUDITOR_AUTH_SECRET:?Set AI_AUDITOR_AUTH_SECRET in .env.prod}
      SETUP_INTEGRATIONS_TOKEN: ${SETUP_INTEGRATIONS_TOKEN:?Set SETUP_INTEGRATIONS_TOKEN in .env.prod}
      AI_AUDITOR_JOB_STALE_SECONDS: ${AI_AUDITOR_JOB_STALE_SECONDS:-7200}
      BITRIX_OAUTH_CLIENT_ID: ${BITRIX_OAUTH_CLIENT_ID:-}
      BITRIX_OAUTH_CLIENT_SECRET: ${BITRIX_OAUTH_CLIENT_SECRET:-}
      BITRIX_APPLICATION_TOKEN: ${BITRIX_APPLICATION_TOKEN:-}
      BITRIX_OAUTH_TOKEN_ENDPOINT: ${BITRIX_OAUTH_TOKEN_ENDPOINT:-}
      BITRIX_OAUTH_SUCCESS_RETURN_URL: ${BITRIX_OAUTH_SUCCESS_RETURN_URL:-}
      BITRIX_OAUTH_STATE_TTL_SECONDS: ${BITRIX_OAUTH_STATE_TTL_SECONDS:-}
      BITRIX_CONNECT_SESSION_TTL_SECONDS: ${BITRIX_CONNECT_SESSION_TTL_SECONDS:-}
      BITRIX_OAUTH_SETTINGS_REDIRECT: ${BITRIX_OAUTH_SETTINGS_REDIRECT:-}
      AI_AUDITOR_PUBLIC_BASE_URL: ${AI_AUDITOR_PUBLIC_BASE_URL:-}
    volumes:
      - ./storage:/app/storage
      - ./export:/app/export
    expose:
      - "8000"

  frontend:
    build:
      context: ../ai-auditor-front-main
      args:
        VITE_BACKEND_URL: live
        VITE_AUTH_REQUIRED: "true"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  postgres_data:
